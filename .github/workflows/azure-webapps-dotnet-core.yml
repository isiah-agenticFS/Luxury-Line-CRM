# Builds and packages a .NET Framework 4.8 ASP.NET Web Forms app with MSBuild,
# then deploys the package to Azure App Service.

name: Build and deploy ASP.NET Framework app to Azure Web App

env:
  # Set repository variable AZURE_WEBAPP_NAME to your Azure App Service name.
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  PROJECT_FILE: ScrubCRM.csproj
  PACKAGE_PATH: ${{ github.workspace }}/artifacts/WebApp.zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.PROJECT_FILE }}

      - name: Build and package with MSBuild
        run: >
          msbuild ${{ env.PROJECT_FILE }}
          /p:Configuration=Release
          /p:DeployOnBuild=true
          /p:WebPublishMethod=Package
          /p:PackageAsSingleFile=true
          /p:SkipInvalidConfigurations=true
          /p:PackageLocation="${{ env.PACKAGE_PATH }}"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: webapp-package
          path: artifacts/WebApp.zip

  deploy:
    permissions:
      contents: none
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp-package
          path: artifacts

      - name: Validate Azure app name configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ env.AZURE_WEBAPP_NAME }}")) {
            throw "Set repository variable AZURE_WEBAPP_NAME before running deploy."
          }
          if ("${{ env.AZURE_WEBAPP_NAME }}" -eq "your-app-name") {
            throw "Replace placeholder Azure app name with a real app name."
          }

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: artifacts/WebApp.zip
