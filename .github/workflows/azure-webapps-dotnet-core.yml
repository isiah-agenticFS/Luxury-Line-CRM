# Builds the ASP.NET Framework 4.8 WebForms app with MSBuild on a Windows runner
# and deploys the published output to Azure App Service.
#
# Before this workflow will succeed you must:
#   1. Create the Azure App Service (Windows, .NET Framework 4.8 / ASP.NET stack).
#   2. Download its Publish Profile from the Azure Portal Overview page and save
#      it as a repository secret named AZURE_WEBAPP_PUBLISH_PROFILE.
#   3. In the Azure Portal > App Service > Configuration > Connection strings, add
#      a connection string named DefaultConnection (type SQLAzure) pointing at
#      your Azure SQL database — this overrides the LocalDB value in Web.config.
#
# For more information on GitHub Actions for Azure:
#   https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action:
#   https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.NET Framework app to Azure Web App - LuxuryLinePortal

env:
  AZURE_WEBAPP_NAME: LuxuryLinePortal

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        run: nuget restore ScrubCRM.csproj -PackagesDirectory packages

      - name: Build and publish with MSBuild
        run: |
          msbuild ScrubCRM.csproj `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:publishUrl=${{ github.workspace }}\published `
            /p:DeleteExistingFiles=true

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: asp-net-app
          path: ${{ github.workspace }}\published

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: asp-net-app
          path: .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
